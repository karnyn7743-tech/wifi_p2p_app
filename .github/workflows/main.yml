name: Flutter Build APK

on:
  push:
    branches:
      - main  # أو اسم الفرع الأساسي لديك مثل master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java (ضرورية لـ Android)
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد بيئة Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # يمكنك تحديد إصدار معين مثل 3.22.0
          channel: 'stable'
          cache: true

      # 4. جلب المكتبات (Packages)
      - name: Install Dependencies
        run: flutter pub get

      # 5. بناء تطبيق APK (Release)
      - name: Build APK
        run: flutter build apk --release

      # 6. رفع ملف الـ APK لتتمكن من تنزيله من GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
