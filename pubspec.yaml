name: wifi_p2p_app
description: "تطبيق الاتصالات المحلي"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  connectivity_plus: ^6.0.3

  # 1. مكتبات الهوية والتشفير والتخزين
  device_info_plus: ^10.1.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # 2. الصوت والأذونات
  audioplayers: ^6.0.0
  permission_handler: ^11.0.0

  # 3. خدمات الخلفية والشبكة والاتصال
  flutter_webrtc: ^0.12.4
  flutter_background_service: ^5.0.0
  flutter_local_notifications: ^17.0.0
  
  # ⚡ حزمة التسجيل الأساسية
  record: 5.1.2
  path_provider: ^2.1.2

# ⚡ محاذاة جميع واجهات المنصات المرفقة لمنع التعارض في سيرفر Codemagic
dependency_overrides:
  record_platform_interface: 1.2.0
  record_linux: 0.7.2
  record_android: 1.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
